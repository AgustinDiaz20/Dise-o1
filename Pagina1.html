<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primera Página de Agustín</title>
  <!-- Bootstrap 3 CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
  <style>
    body {
      padding-top: 20px;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #8fd3f4);
      font-family: 'Trebuchet MS', sans-serif;
    }
    h1.titulo {
      text-align: center;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      font-weight: bold;
      font-size: 3em;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #ff512f, #dd2476, #f7b733, #4facfe, #43e97b);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: colorShift 5s ease infinite;
    }
    @keyframes colorShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    aside, main {
      padding: 20px;
      min-height: 300px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      color: #ffffff;
      font-weight: bold;
    }
    aside {
      background: linear-gradient(160deg, #f857a6, #ff5858);
    }
    main {
      background: linear-gradient(160deg, #43cea2, #185a9d);
    }
  </style>
</head>
<body>

  <h1 class="titulo">Primera Página de Agustín</h1>

  <!-- Estructura básica de una grilla 3/9 en Bootstrap 3 (Listing 1) -->
  <div class="container">
    <div class="row">
      <aside class="col-lg-3">
        Contenido secundario
      </aside>

      <main class="col-lg-9">
        Contenido principal
      </main>
    </div>
  </div>

  <!-- Bootstrap 3 JS (opcional, requiere jQuery) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>
</html>
